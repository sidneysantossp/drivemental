name: Validate Drive Astral

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  deployments: read
  statuses: read

jobs:
  predeploy:
    name: Pre-deploy gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run automated tests
        run: npm test

      - name: Build static deployment
        run: npm run build

      - name: Validate migrations and production configuration
        run: bash scripts/migration-schema-check.sh

      - name: Run security sanity scan
        run: bash scripts/security-sanity-check.sh

      - name: Check critical deployment files
        run: |
          test -f supabase/migrations/202606130001_initial_schema.sql
          test -f supabase/migrations/202606240001_remove_payment_integration.sql
          test -f supabase/functions/delete-account/index.ts
          test -f scripts/release-runtime-proof.sh
          test -f scripts/release-deployment-check.sh
          test -f docs/producao/backup-recovery-runbook.md

  postdeploy:
    name: Post-deploy runtime gate
    needs: predeploy
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for the Production deployment status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 24); do
            if bash scripts/release-deployment-check.sh; then
              exit 0
            fi
            echo "Production deployment not ready yet (attempt ${attempt}/24); waiting 5s."
            sleep 5
          done
          echo "Production deployment did not reach success for this SHA within the gate window."
          exit 1

      - name: Run production smoke and runtime proof
        env:
          DM_PRODUCTION_URL: https://drivemental.vercel.app
          DM_DELETE_ACCOUNT_URL: https://qgvlkpaociypyxduvsqm.supabase.co/functions/v1/delete-account
          DM_EXPECTED_RELEASE: 2026.08.21-f7-rc1
        run: bash scripts/release-runtime-proof.sh
